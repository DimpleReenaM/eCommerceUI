   <div class="reset-password-container">
  <div class="password-reset-card">
    <!-- Animated header with icon -->
    <div class="header">
      <div class="lock-icon">
        <svg class="lock-animate" width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 15V17M6 21H18C19.1046 21 20 20.1046 20 19V13C20 11.8954 19.1046 11 18 11H6C4.89543 11 4 11.8954 4 13V19C4 20.1046 4.89543 21 6 21Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path class="lock-shackle" d="M16 11V7C16 4.79086 14.2091 3 12 3C9.79086 3 8 4.79086 8 7V11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h2>Reset Your Password</h2>
      <p class="subtitle">Create a new secure password</p>
    </div>

    <form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()" class="reset-form">
      <!-- New Password Field -->
      <div class="form-group floating">
        <input id="newPassword" formControlName="newPassword" type="password" class="form-control" placeholder=" " 
               [ngClass]="{'invalid': resetPasswordForm.get('newPassword')?.invalid && resetPasswordForm.get('newPassword')?.touched}" />
        <label for="newPassword">New Password</label>
        <div class="password-strength" *ngIf="resetPasswordForm.get('newPassword')?.value">
          <div class="strength-bar" [ngClass]="getPasswordStrengthClass()"></div>
        </div>
        <div *ngIf="resetPasswordForm.get('newPassword')?.invalid && resetPasswordForm.get('newPassword')?.touched" class="error-message">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 8V12M12 16H12.01M22 12C22 17.5228 17.5228 22 12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C17.5228 2 22 6.47715 22 12Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Password must be at least 6 characters with one number
        </div>
      </div>
      
      <!-- Confirm Password Field -->
      <div class="form-group floating">
        <input id="confirmPassword" formControlName="confirmPassword" type="password" class="form-control" placeholder=" " 
               [ngClass]="{'invalid': resetPasswordForm.get('confirmPassword')?.invalid && resetPasswordForm.get('confirmPassword')?.touched}" />
        <label for="confirmPassword">Confirm Password</label>
        <div *ngIf="resetPasswordForm.get('confirmPassword')?.invalid && resetPasswordForm.get('confirmPassword')?.touched" class="error-message">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 8V12M12 16H12.01M22 12C22 17.5228 17.5228 22 12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C17.5228 2 22 6.47715 22 12Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Passwords don't match
        </div>
      </div>
      
      <!-- Submit Button -->
      <button type="submit" class="submit-btn" [disabled]="loading">
        <span *ngIf="!loading">Reset Password</span>
        <span *ngIf="loading" class="spinner"></span>
      </button>
    </form>
  </div>
  <!-- Toast Notification -->
<div class="toast-container" [class.show]="showToast" [class.success]="toastType === 'success'" 
     [class.error]="toastType === 'error'" [class.warning]="toastType === 'warning'">
  <div class="toast-icon">
    <svg viewBox="0 0 24 24" *ngIf="toastIcon === 'check-circle'">
      <path d="M12 2C6.5 2 2 6.5 2 12S6.5 22 12 22 22 17.5 22 12 17.5 2 12 2M10 17L5 12L6.41 10.59L10 14.17L17.59 6.58L19 8L10 17Z" />
    </svg>
    <svg viewBox="0 0 24 24" *ngIf="toastIcon === 'alert-circle'">
      <path d="M13,13H11V7H13M13,17H11V15H13M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2Z" />
    </svg>
    <svg viewBox="0 0 24 24" *ngIf="toastIcon === 'close-circle'">
      <path d="M12,2C17.53,2 22,6.47 22,12C22,17.53 17.53,22 12,22C6.47,22 2,17.53 2,12C2,6.47 6.47,2 12,2M15.59,7L12,10.59L8.41,7L7,8.41L10.59,12L7,15.59L8.41,17L12,13.41L15.59,17L17,15.59L13.41,12L17,8.41L15.59,7Z" />
    </svg>
    <svg viewBox="0 0 24 24" *ngIf="toastIcon === 'alert'">
      <path d="M13,14H11V10H13M13,18H11V16H13M1,21H23L12,2L1,21Z" />
    </svg>
  </div>
  <div class="toast-message">{{ toastMessage }}</div>
  <button class="toast-close" (click)="hideToast()">
    <svg viewBox="0 0 24 24">
      <path d="M19,6.41L17.59,5L12,10.59L6.41,5L5,6.41L10.59,12L5,17.59L6.41,19L12,13.41L17.59,19L19,17.59L13.41,12L19,6.41Z" />
    </svg>
  </button>
  <div class="toast-progress"></div>
</div>
</div>
