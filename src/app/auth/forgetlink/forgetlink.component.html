<div class="forgot-password-container">
  <div class="forgot-password-card">
    <div class="card-header">
      <div class="lock-icon">
        <svg viewBox="0 0 24 24">
          <path d="M12,17A2,2 0 0,0 14,15C14,13.89 13.1,13 12,13A2,2 0 0,0 10,15A2,2 0 0,0 12,17M18,8A2,2 0 0,1 20,10V20A2,2 0 0,1 18,22H6A2,2 0 0,1 4,20V10C4,8.89 4.9,8 6,8H7V6A5,5 0 0,1 12,1A5,5 0 0,1 17,6V8H18M12,3A3,3 0 0,0 9,6V8H15V6A3,3 0 0,0 12,3Z" />
        </svg>
      </div>
      <h2>Forgot Password</h2>
      <p>Enter your email to receive a reset link</p>
    </div>
    
    <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" class="forgot-password-form">
      <div class="form-group">
        <input id="email" formControlName="email" type="email" class="form-control" placeholder=" " />
        <label for="email">Email Address</label>
        <div class="underline"></div>
        <div *ngIf="forgotPasswordForm.get('email')?.invalid && forgotPasswordForm.get('email')?.touched" class="error-message">
          <svg viewBox="0 0 24 24">
            <path d="M11,15H13V17H11V15M11,7H13V13H11V7M12,2C6.47,2 2,6.5 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20Z" />
          </svg>
          Please enter a valid email
        </div>
      </div>
  
      <button type="submit" class="submit-btn" [disabled]="loading">
        <span class="btn-text">{{ loading ? 'Sending...' : 'Send Reset Link' }}</span>
        <span class="btn-icon">
          <svg viewBox="0 0 24 24">
            <path d="M2,21L23,12L2,3V10L17,12L2,14V21Z" />
          </svg>
        </span>
      </button>
    </form>
    
    <div class="back-to-login">
      <a routerLink="/auth/login">Back to Login</a>
    </div>
  </div>
  
  <div class="animation-circle circle-1"></div>
  <div class="animation-circle circle-2"></div>

  <div class="toast-container" [class.show]="showToast" [class.success]="toastType === 'success'" [class.error]="toastType === 'error'">
  <div class="toast-icon">
    <svg viewBox="0 0 24 24" *ngIf="toastIcon === 'check-circle'">
      <path d="M12 2C6.5 2 2 6.5 2 12S6.5 22 12 22 22 17.5 22 12 17.5 2 12 2M10 17L5 12L6.41 10.59L10 14.17L17.59 6.58L19 8L10 17Z" />
    </svg>
    <svg viewBox="0 0 24 24" *ngIf="toastIcon === 'alert-circle'">
      <path d="M13,13H11V7H13M13,17H11V15H13M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2Z" />
    </svg>
  </div>
  <div class="toast-message">{{ toastMessage }}</div>
  <button class="toast-close" (click)="hideToast()">
    <svg viewBox="0 0 24 24">
      <path d="M19,6.41L17.59,5L12,10.59L6.41,5L5,6.41L10.59,12L5,17.59L6.41,19L12,13.41L17.59,19L19,17.59L13.41,12L19,6.41Z" />
    </svg>
  </button>
  <div class="toast-progress"></div>
</div>
</div>
